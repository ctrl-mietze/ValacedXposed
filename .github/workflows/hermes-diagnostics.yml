name: Hermes Source Diagnostics
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    name: Build line-numbered release JavaScript
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: bundle/.dvmrc
      - name: Install dependencies
        working-directory: bundle
        run: deno install --frozen
      - name: Build exact release JavaScript
        working-directory: bundle
        run: deno run --permission-set=build scripts/build.ts --reproducible --out build/diagnostics
      - name: Upload line-numbered source and manifest
        uses: actions/upload-artifact@v4
        with:
          name: valancedx-release-js-diagnostics
          path: |
            bundle/build/diagnostics/valenced.js
            bundle/build/diagnostics/manifest.json
          if-no-files-found: error
