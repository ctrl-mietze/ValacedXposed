name: ValancedX Signed Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build_release:
    name: Signed Android release
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: bundle/.dvmrc
      - name: Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          printf "y\n%.0s" {1..50} | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Restore signing key
        env:
          SIGNING_KEY_B64: ${{ secrets.VALANCEDX_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.VALANCEDX_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.VALANCEDX_KEY_PASSWORD }}
          SIGNING_ALIAS: ${{ secrets.VALANCEDX_KEY_ALIAS }}
        run: |
          test -n "$SIGNING_KEY_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          test -n "$SIGNING_ALIAS"
          printf '%s' "$SIGNING_KEY_B64" | base64 --decode > "$RUNNER_TEMP/valancedx-release.jks"
          chmod 600 "$RUNNER_TEMP/valancedx-release.jks"

      - name: Build and test signed APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/valancedx-release.jks
          KEYSTORE_PASSWORD: ${{ secrets.VALANCEDX_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.VALANCEDX_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.VALANCEDX_KEY_PASSWORD }}
        run: ./gradlew :android:assembleRelease :android:testDebugUnitTest :bundle:testBundle

      - name: Check release signature and package
        shell: bash
        run: |
          apk="android/build/outputs/apk/release/android-release.apk"
          test -s "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose "$apk"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | head -n 5
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$apk" | grep -F "package: name='ctrl.mietze.valacedxposed'"
          version="$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' android/build.gradle.kts | head -n 1)"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v$version"
          fi
          mkdir -p dist
          cp "$apk" "dist/ValancedX-v${version}-release.apk"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)

      - name: Upload verified signed APK
        uses: actions/upload-artifact@v4
        with:
          name: valancedx-signed-release
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --target "$GITHUB_SHA" \
            --title "ValancedX ${GITHUB_REF_NAME#v}" \
            --notes-file docs/RELEASE_1.0.0.md \
            --latest \
            dist/*.apk dist/SHA256SUMS.txt
