name: ValacedXposed Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Android Xposed module
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version-file: bundle/.dvmrc
      - name: Android platform
        shell: bash
        run: |
          SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager | head -n 1)"
          test -x "$SDKMANAGER"
          printf "y\n%.0s" {1..50} | "$SDKMANAGER" --licenses >/dev/null
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: ./gradlew :android:assembleDebug :android:testDebugUnitTest :bundle:testBundle
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: valancedx-debug-apk
          path: android/build/outputs/apk/debug/*.apk
          if-no-files-found: error

